[tox]
requires =
    tox>=4.2
    tox-uv>=1.20.2
env_list =
    lint
    docs
    d{60, 52, 42}-mypy
    d{60, 52, 42}-py{314, 313, 312}
    pkg_meta
skip_missing_interpreters = true

[testenv]
package = wheel
wheel_build_env = .pkg
deps =
    d32: django==3.2.*
    d42: django==4.2.*
    d52: django==5.2.*
    d60: django==6.0.*
pass_env =
    PYTHONBREAKPOINT
    PYTHONDONTWRITEBYTECODE
commands =
    {posargs: pytest}
dependency_groups = dev

[testenv:lint]
description = run static analysis and style check using ruff
skip_install = true
deps =
    pre-commit-uv>=4.1.1
pass_env =
    HOMEPATH
    PROGRAMDATA
commands =
    pre-commit run --all-files --show-diff-on-failure

[testenv:pkg_meta]
runner = uv-venv-runner
description = check final package
skip_install = true
deps =
    check-wheel-contents>=0.6
    twine>=5.1.1
    uv>=0.7
commands =
    uv build --sdist --wheel --out-dir {env_dir}/dist .
    twine check {env_dir}/dist/*
    check-wheel-contents --no-config {env_dir}/dist
