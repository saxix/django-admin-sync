[tox]
requires =
    tox>=4.2
    tox-uv>=1.20.2
env_list =
    lint
    docs
    d{5.2, 4.2, 3.2}-mypy
    d{3.2}-py{312}
    d{4.2}-py{312}
    d{5.2}-py{313}
    pkg_meta
skip_missing_interpreters = true

[testenv]
package = wheel
wheel_build_env = .pkg
deps =
    d3.2: django==3.2.*
    d4.2: django==4.2.*
    d5.2: django==5.2.*
pass_env =
    PYTHONBREAKPOINT
    PYTHONDONTWRITEBYTECODE
commands =
    {posargs: pytest}
dependency_groups = dev

[testenv:lint]
description = run static analysis and style check using ruff
skip_install = true
deps =
    pre-commit-uv>=4.1.1
pass_env =
    HOMEPATH
    PROGRAMDATA
commands =
    pre-commit run --all-files --show-diff-on-failure

[testenv:pkg_meta]
runner = uv-venv-runner
description = check final package
skip_install = true
deps =
    check-wheel-contents>=0.6
    twine>=5.1.1
    uv>=0.7
commands =
    uv build --sdist --wheel --out-dir {env_dir}/dist .
    twine check {env_dir}/dist/*
    check-wheel-contents --no-config {env_dir}/dist

[testenv:d32-mypy]
commands =
    {[type]commands}
base = type

[testenv:d42-mypy]
commands =
    {[type]commands}
base = type

[testenv:d52-mypy]
commands =
    {[type]commands}
base = type

[type]
description = run type check on code base
commands =
    mypy --config-file mypy.ini
deps =
    d3.2: django==3.2.*
    d4.2: django==4.2.*
    d5.2: django==5.2.*
dependency_groups =
    dev
    d3.2: mypy
    d4.2: mypy
    d5.2: mypy
