[tox]
requires =
    tox>=4.2
    tox-uv>=1.20.2
env_list =
    lint
    docs
    mypy
    d{32}-py{312}
    d{42}-py{312}
    d{52}-py{313}
    pkg_meta
skip_missing_interpreters = true

[testenv]
runner = uv-venv-lock-runner
package = wheel
wheel_build_env = .pkg
deps =
    d42: django==4.2.*
    d52: django==5.2.*
pass_env =
    PGHOST
    PGPORT
    PYTHONDONTWRITEBYTECODE
commands =
    pytest
dependency_groups = dev

[testenv:lint]
description = run static analysis and style check using ruff
skip_install = true
deps =
    pre-commit-uv>=4.1.1
pass_env =
    HOMEPATH
    PROGRAMDATA
commands =
    pre-commit run --all-files --show-diff-on-failure

[testenv:mypy]
runner = uv-venv-lock-runner
description = run mypy type checking
skip_install = false
set_env =
    SECRET_KEY = super-secret-key-just-for-testing
commands =
    mypy --config-file mypy.ini {posargs:}
dependency_groups = mypy,dev

[testenv:pkg_meta]
runner = uv-venv-runner
description = check final package
skip_install = true
deps =
    check-wheel-contents>=0.6
    twine>=5.1.1
    uv>=0.7
commands =
    uv build --sdist --wheel --out-dir {env_dir}/dist .
    twine check {env_dir}/dist/*
    check-wheel-contents --no-config {env_dir}/dist
