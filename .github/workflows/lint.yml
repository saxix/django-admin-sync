
name: Lint

on:
  workflow_dispatch:
  push:
    branches: [ "develop" ]
    tags-ignore: [ "**" ]
  pull_request:
  schedule:
    - cron: "0 8 * * *"

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    defaults:
      run:
        shell: bash
    outputs:
      package: ${{ steps.changes.outputs.package }}
      lint: ${{ steps.changes.outputs.lint }}
      mypy: ${{ steps.changes.outputs.mypy }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - id: changes
        if: ${{ !github.event.act }}
        name: Check for file changes
        uses: dorny/paths-filter@0bc4621a3135347011ad047f9ecf449bf72ce2bd # v3.0.0
        with:
          base: ${{ github.ref }}
          token: ${{ github.token }}
          filters: .github/file-filters.yml

  lint:
    needs: [ changes ]
    if: needs.changes.outputs.lint == 'true' || github.event.act
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v2

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip pre-commit
      - name: Lint with flake8
        run: |
          pre-commit run --all

  pkg_meta:
    runs-on: ubuntu-latest
    needs: [ changes ]
    if: needs.changes.outputs.package == 'true' || github.event.act
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v2

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip tox
      - name: Lint with flake8
        run: |
          tox -e pkg_meta
  mypy:
    runs-on: ubuntu-latest
    needs: [ changes ]
    if: needs.changes.outputs.mypy == 'true' || github.event.act
    strategy:
      fail-fast: false
      matrix:
        django: [ "3.2", "4.2", "5.2"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v2

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip tox
      - name: Lint with flake8
        run: |
          tox -e d${{ matrix.django }}-mypy
