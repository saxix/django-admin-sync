name: Test

on:
  push:
    branches:
      - master
      - develop
  pull_request:

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    defaults:
      run:
        shell: bash
    outputs:
      run_tests: ${{ steps.changes.outputs.run_tests }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - id: changes
        name: Check for file changes
        uses: dorny/paths-filter@v4
        with:
          base: ${{ github.ref }}
          token: ${{ github.token }}
          filters: .github/file-filters.yml

  test:
    needs: [ changes ]
    if: needs.changes.outputs.run_tests == 'true'

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        django: [ "60", "52", "42" ]
        python: [ "3.14", "3.13", "3.12" ]
        exclude:
          - python: "3.14"
            django: "42"
    env:
      PY_VER: ${{ matrix.python}}
      DJ_VER: ${{ matrix.django}}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_ALWAYS_EAGER: true

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      -   name: Install the latest version of uv
          uses: astral-sh/setup-uv@v5
          with:
              version: "latest"
              enable-cache: true
              cache-dependency-glob: |
                  pyproject.toml
                  uv.lock
              cache-suffix: ${{ matrix.python }}-${{ matrix.django }}
              github-token: ${{ secrets.GITHUB_TOKEN }}
              python-version: ${{ matrix.python }}

      -   name: Install tox
          run: uv tool install --python-preference only-managed --python 3.13 tox --with tox-uv --with tox-gh-actions

      -   name: Install Python
          if: matrix.python != '3.13'
          run: uv python install --python-preference only-managed ${{ matrix.python }}

      -   name: Setup test suite
          run: tox run -vv --notest --skip-missing-interpreters false

      - name: Test with
        run: tox run -e d${DJ_VER//.}-py${PY_VER//.}-${DBENGINE}

      -   name: Upload test results to Codecov
          uses: codecov/test-results-action@v1
          with:
              env_vars: OS
              files: ./junit-*.xml
              flags: ${{ matrix.django }} ${{ matrix.python }}
              token: ${{ secrets.CODECOV_TOKEN }}
              verbose: true

      -   name: Upload coverage to Codecov
          uses: codecov/codecov-action@v6
          with:
              env_vars: OS,PYTHON
              fail_ci_if_error: true
              files: ./coverage-*.xml
              flags: unittests
              name: codecov-umbrella
              token: ${{ secrets.CODECOV_TOKEN }}
              verbose: true
